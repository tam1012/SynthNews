services:
  scrapling:
    build: ./scrapling-sidecar
    container_name: newstamhv-scrapling
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Reap zombie browser processes (Camoufox/Firefox children) that
    # StealthyFetcher leaves behind on crash/timeout. Without an init as PID 1,
    # these accumulate into thousands of defunct PIDs and melt the host CPU.
    init: true
    environment:
      TZ: Asia/Ho_Chi_Minh
      SCRAPLING_SERVICE_TOKEN: ${SCRAPLING_SERVICE_TOKEN:?SCRAPLING_SERVICE_TOKEN is required}
      SCRAPLING_TIMEOUT_MS: ${SCRAPLING_TIMEOUT_MS:-60000}
      SCRAPLING_WORKERS: ${SCRAPLING_WORKERS:-1}
      SCRAPLING_MAX_CONCURRENCY: ${SCRAPLING_MAX_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          # Hard ceiling on processes: one runaway fetch can fork hundreds of
          # browser children; cap it so a leak can never exhaust host PIDs again.
          pids: 512

  db:
    image: postgres:16-alpine
    container_name: newstamhv-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: newstamhv
      POSTGRES_USER: newstamhv
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newstamhv"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build: .
    container_name: newstamhv-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      scrapling:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: 3000
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://synthnews.site}
      DATABASE_URL: postgresql://newstamhv:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/newstamhv
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      SCRAPE_INTERVAL_HOURS: ${SCRAPE_INTERVAL_HOURS:-1}
      MAX_ARTICLES_PER_SOURCE: ${MAX_ARTICLES_PER_SOURCE:-50}
      MAX_AI_CALLS_PER_RUN: ${MAX_AI_CALLS_PER_RUN:-30}
      DIGEST_ARTICLE_LIMIT: ${DIGEST_ARTICLE_LIMIT:-100}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      VOZ_MAX_THREAD_PAGES: ${VOZ_MAX_THREAD_PAGES:-15}
      FORUM_MAX_COMMENTS: ${FORUM_MAX_COMMENTS:-70}
      FORUM_MIN_COMMENTS: ${FORUM_MIN_COMMENTS:-10}
      FORUM_RAW_CONTENT_MAX_LENGTH: ${FORUM_RAW_CONTENT_MAX_LENGTH:-80000}
      REDDIT_COMMENT_LIMIT: ${REDDIT_COMMENT_LIMIT:-30}
      REDDIT_COMMENT_DEPTH: ${REDDIT_COMMENT_DEPTH:-3}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USERNAME: ${REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${REDDIT_PASSWORD:-}
      REDDIT_PROXY_URL: ${REDDIT_PROXY_URL:-}
      BROWSER_PROXY_URL: ${BROWSER_PROXY_URL:-}
      VOZ_PROXY_URL: ${VOZ_PROXY_URL:-}
      WORKER_PROXY_URL: ${WORKER_PROXY_URL:-}
      WORKER_PROXY_TOKEN: ${WORKER_PROXY_TOKEN:-}
      WORKER_PROXY_SKIP_DOMAINS: ${WORKER_PROXY_SKIP_DOMAINS:-voz.vn,vozforums.com}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      SCRAPLING_PROXY_DOMAINS: ${SCRAPLING_PROXY_DOMAINS:-}
      REUTERS_COOKIE_HEADER: ${REUTERS_COOKIE_HEADER:-}
      REUTERS_COOKIE_HEADER_B64: ${REUTERS_COOKIE_HEADER_B64:-}
      REUTERS_COOKIE_HEADER_B64_FILE: ${REUTERS_COOKIE_HEADER_B64_FILE:-/app/runtime/reuters-cookie/reuters-cookie.b64}
      FETCH_COOKIE_REUTERS_COM: ${FETCH_COOKIE_REUTERS_COM:-}
      FETCH_COOKIE_REUTERS_COM_B64: ${FETCH_COOKIE_REUTERS_COM_B64:-}
      FETCH_COOKIE_REUTERS_COM_B64_FILE: ${FETCH_COOKIE_REUTERS_COM_B64_FILE:-}
      FETCH_PER_DOMAIN_DELAY_MS: ${FETCH_PER_DOMAIN_DELAY_MS:-15000}
      SCRAPLING_SERVICE_TOKEN: ${SCRAPLING_SERVICE_TOKEN:?SCRAPLING_SERVICE_TOKEN is required}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      FIRECRAWL_MAX_PER_DAY: ${FIRECRAWL_MAX_PER_DAY:-30}
      SCRAPINGANT_API_KEY: ${SCRAPINGANT_API_KEY:-}
      SCRAPINGANT_MAX_PER_DAY: ${SCRAPINGANT_MAX_PER_DAY:-300}
      SCRAPEDO_API_KEY: ${SCRAPEDO_API_KEY:-}
      SCRAPEDO_MAX_PER_DAY: ${SCRAPEDO_MAX_PER_DAY:-30}
      HOSTED_FETCH_DOMAINS: ${HOSTED_FETCH_DOMAINS:-}
      FIRECRAWL_DOMAINS: ${FIRECRAWL_DOMAINS:-}
      DATADOME_DOMAINS: ${DATADOME_DOMAINS:-reuters.com,bloomberg.com}
      PAYWALL_ARCHIVE_DOMAINS: ${PAYWALL_ARCHIVE_DOMAINS:-}
      ARCHIVE_TODAY_HOST: ${ARCHIVE_TODAY_HOST:-archive.ph}
      ENABLE_SITEMAP_DISCOVERY: ${ENABLE_SITEMAP_DISCOVERY:-true}
      SCRAPLING_SERVICE_URL: ${SCRAPLING_SERVICE_URL:-http://scrapling:8000}
    volumes:
      - reuters_cookie_runtime:/app/runtime/reuters-cookie
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health/live >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  reuters-cookie-refresh:
    build: .
    container_name: newstamhv-reuters-cookie-refresh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      REUTERS_COOKIE_HEADER: ${REUTERS_COOKIE_HEADER:-}
      REUTERS_COOKIE_HEADER_B64: ${REUTERS_COOKIE_HEADER_B64:-}
      REUTERS_COOKIE_HEADER_B64_FILE: ${REUTERS_COOKIE_HEADER_B64_FILE:-/app/runtime/reuters-cookie/reuters-cookie.b64}
      REUTERS_COOKIE_RUNTIME_DIR: ${REUTERS_COOKIE_RUNTIME_DIR:-/app/runtime/reuters-cookie}
      REUTERS_COOKIE_REFRESH_INTERVAL_SECONDS: ${REUTERS_COOKIE_REFRESH_INTERVAL_SECONDS:-21600}
      REUTERS_COOKIE_REFRESH_COOLDOWN_SECONDS: ${REUTERS_COOKIE_REFRESH_COOLDOWN_SECONDS:-900}
      REUTERS_COOKIE_VERIFY_URL: ${REUTERS_COOKIE_VERIFY_URL:-https://www.reuters.com/world/}
    volumes:
      - reuters_cookie_runtime:/app/runtime/reuters-cookie
    command:
      - sh
      - -c
      - |
        while true; do
          node /app/scripts/refresh-reuters-cookie.mjs || true
          sleep "$${REUTERS_COOKIE_REFRESH_INTERVAL_SECONDS:-21600}"
        done

  reuters-profile-browser:
    build: .
    container_name: newstamhv-reuters-profile-browser
    restart: "no"
    profiles: ["manual"]
    security_opt:
      - no-new-privileges:true
    shm_size: "1gb"
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      DISPLAY: :99
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      REUTERS_COOKIE_RUNTIME_DIR: ${REUTERS_COOKIE_RUNTIME_DIR:-/app/runtime/reuters-cookie}
      REUTERS_COOKIE_PROFILE_DIR: ${REUTERS_COOKIE_PROFILE_DIR:-/app/runtime/reuters-cookie/profile}
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - reuters_cookie_runtime:/app/runtime/reuters-cookie
    command:
      - sh
      - -c
      - |
        rm -f /tmp/.X99-lock
        Xvfb :99 -screen 0 1365x900x24 -nolisten tcp &
        sleep 5
        fluxbox >/tmp/fluxbox.log 2>&1 &
        x11vnc -display :99 -forever -shared -nopw -listen 127.0.0.1 -rfbport 5900 -bg -o /tmp/x11vnc.log
        sleep 2
        websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900 >/tmp/novnc.log 2>&1 &
        node /app/scripts/open-reuters-profile-browser.mjs

volumes:
  pgdata:
  reuters_cookie_runtime:
